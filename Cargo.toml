[workspace]
resolver = "2"
members = [
    "crates/survey",
    "crates/hackgu-cpk",
    "crates/hackgu-ccs",
    "crates/hackgu-vfs", "crates/hackgu-render",
    "crates/hackgu-export", "crates/hackgu-disasm", "crates/hackgu-world",
    "crates/hackgu-game", "crates/hackgu-engine",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
