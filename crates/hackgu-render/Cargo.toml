[package]
name = "hackgu-render"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "hackgu_render"
path = "src/lib.rs"

[[bin]]
name = "hackgu-render"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hackgu-ccs = { path = "../hackgu-ccs" }
hackgu-vfs = { path = "../hackgu-vfs" }
hackgu-cpk = { path = "../hackgu-cpk" }
wgpu = "24"
winit = "0.30"
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.29"
pollster = "0.4"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
hackgu-export = { path = "../hackgu-export" }
hackgu-world = { path = "../hackgu-world" }
hackgu-game = { path = "../hackgu-game" }
gilrs = "0.11.2"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
cridecoder = "0.3.7"
